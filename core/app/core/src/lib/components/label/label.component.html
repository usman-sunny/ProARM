<ng-container *ngIf="(languages$ | async) as languages">
    <ng-container *ngIf="!listKey && labelKey">
        <!-- <ng-container *ngIf="abcd != 'Email Address' && abcd != 'Primary' && abcd != 'Opt Out' && abcd != 'Invalid'"> -->
        <!-- {{language.getFieldLabel(labelKey, module)}} -->
        <!-- </ng-container> -->
         
        <ng-container *ngIf="language.getFieldLabel(labelKey, module) == 'Are you sure you want to delete this record?'; else elseIfBlock">
            <div class="cstm-delete-modal-label">Delete</div>
            <div class="cstm-delete-modal-text">{{language.getFieldLabel(labelKey, module)}}</div>
        </ng-container>

        <ng-template #elseIfBlock>
            <ng-container *ngIf="language.getFieldLabel(labelKey, module) == 'You are about to leave this record without saving any changes you may have made to the record. Are you sure you want to navigate away from this record?'; else elseIfBlock2">
                <div class="cstm-edit-modal-label">Cancel Edit</div>
                <div class="cstm-edit-modal-text">{{language.getFieldLabel(labelKey, module)}}</div>
            </ng-container>
        </ng-template>

        <ng-template #elseIfBlock2>
            <ng-container *ngIf="language.getFieldLabel(labelKey, module) == 'Proceed'; else elseBlock">
                Confirm
            </ng-container>
        </ng-template>

        <ng-template #elseBlock>
            {{language.getFieldLabel(labelKey, module)}}
        </ng-template>

    </ng-container>
    <ng-container *ngIf="listKey && labelKey">
        {{language.getListLabel(listKey, labelKey)}}
    </ng-container>
</ng-container>
