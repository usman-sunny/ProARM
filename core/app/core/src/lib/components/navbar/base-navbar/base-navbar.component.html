<!-- Start of main navbar section -->
<ng-container *ngIf="this.isUserLoggedIn && !mobileNavbar">
<div *ngIf="(vm$ | async) as vm" class="top-panel fixed-top" [ngClass]="{'ln-collapsed': !ln_open, 'hide-base-navbar': navbar?.current?.module == 'pd_analytics' || navbar?.current?.module == 'pd_collections'}" >
    
        <div class="collapse-section">
            <div *ngIf="ln_open" class="collapse-heading">ProARM</div>
        
            <div (click)="toggleLeftNav()" class="collapse-btn">
                <scrm-image *ngIf="ln_open" class="ln-icon-size" image="left-arrow"></scrm-image>
                <scrm-image *ngIf="!ln_open" class="ln-icon-size" image="right-arrow"></scrm-image>
            </div>
        </div>

        <div #lnBody class="ln-body">
            
            <div class="ln-body-left">
                <div class="ln-bl-top">
                    <!-- Home -->
                    <ng-container *ngIf="!navbar.current && !retrievedArray">
                        <div (click)="listSubMenu(); resetActiveState()" class="ln-bl-items ln-bl-active">
                            <a [routerLink]="getHomePage()" class="bl-item">
                                <div class="bl-item-icon">
                                    <scrm-image class="ln-icon-size" image="home-white"></scrm-image>
                                </div>
                                <div class="bl-item-text ln-bl-white">Home</div> <!-- *ngIf="ln_open" -->
                            </a>
                        </div>
                    </ng-container>

                    <ng-container *ngIf="navbar.current || retrievedArray">
                        <div (click)="listSubMenu(); resetActiveState()" class="ln-bl-items">
                            <a [routerLink]="getHomePage()" class="bl-item">
                                <div class="bl-item-icon">
                                    <scrm-image class="ln-icon-size" image="home"></scrm-image>
                                </div>
                                <div class="bl-item-text">Home</div> <!-- *ngIf="ln_open" -->
                            </a>
                        </div>
                    </ng-container>

                    <!-- End Home -->

                    <!-- Current module -->
                    <ng-container *ngIf="navbar.current && navbar?.menu[0]?.link?.route">
                        <div class="ln-bl-items ln-bl-active">
                            <a [routerLink]="navbar.current.link.route" (click)="openSubMenu(); resetActiveState()" class="bl-item">
                                <div class="bl-item-icon">
                                    <ng-container *ngIf="defaultModuleIcons.includes(navbar.current.icon)">
                                        <ng-container *ngIf="['Accounts', 'Contacts', 'Opportunities', 'Leads', 'AOS_Quotes', 'Calendar', 'Documents'].includes(navbar.current.icon)">
                                            <scrm-image class="ln-icon-size" image="{{navbar.current.icon}}-white"></scrm-image>
                                        </ng-container>
                                        <ng-container *ngIf="!['Accounts', 'Contacts', 'Opportunities', 'Leads', 'AOS_Quotes', 'Calendar', 'Documents'].includes(navbar.current.icon)">
                                            <scrm-image class="ln-icon-size ln-icon-active-filled-white" image="{{navbar.current.icon}}"></scrm-image>
                                        </ng-container>
                                    </ng-container>
                                    <ng-container *ngIf="!defaultModuleIcons.includes(navbar.current.icon)">
                                        <scrm-image class="ln-icon-size ln-icon-active-filled-white" image="spark"></scrm-image>
                                    </ng-container>
                                </div>
                                <div class="bl-item-text ln-bl-white"> <!-- *ngIf="ln_open" -->
                                    <div class="bl-item-text-core" [title]="navbar.current.link.label">{{navbar.current.link.label}}</div>
                                </div>
                            </a>
                        </div>
                    </ng-container>
                    <!-- End Current Module -->

                    <!-- Default Modules and Module Menu filters -->
                    <ng-container *ngFor="let item of navbar.menu; let i = index">
                        <!-- Default Modules -->
                        <ng-container *ngIf="item.link.route">
                            <div (click)="listSubMenu(['2nothing2'])" 
                                 (mouseenter)="showTempSubMenu(item.submenu)"
                                 (mouseleave)="hideTempSubMenu()"
                                 class="ln-bl-items"
                                >
                                <a [routerLink]="item.link.route" class="bl-item">
                                    <div class="bl-item-icon">
                                        <scrm-image class="ln-icon-size" image="{{item.icon}}"></scrm-image>
                                    </div>
                                    <div class="bl-item-text"> <!-- *ngIf="ln_open" -->
                                        <div class="bl-item-text-core" [title]="item.link.label">{{item.link.label}}</div>
                                    </div>
                                </a>
                            </div>
                        </ng-container>
                        <!-- Module Menu Filters -->
                        <!-- <ng-template #noRoute> 
                            <div (click)="listSubMenu(item.submenu); activeModuleMenu($event); setCurrentModuleFilter(item)" 
                                 (mouseenter)="showTempSubMenu(item.submenu)" 
                                 (mouseleave)="hideTempSubMenu()" 
                                 class="ln-bl-items ln-bl-module-menu" 
                                 [class.active]="retrievedArray?.link?.label == item?.link?.label"
                                > --> <!-- resetActiveStateOfSubmenu(); -->
                                <!-- <div class="bl-item">
                                    <div class="bl-item-icon">
                                        <scrm-image class="ln-icon-size" image="folder"></scrm-image>
                                    </div>
                                    <div class="bl-item-text"> --> <!-- *ngIf="ln_open" -->
                                        <!-- <div class="bl-item-text-core" [title]="item.link.label">{{item.link.label}}</div>
                                    </div>
                                </div>
                            </div>
                        </ng-template> -->
                    </ng-container> 
                    <!-- End Default Module -->

                    <!-- Module Menu Filters -->
                    <ng-container *ngIf="menuFilters$ | async as menuFilters">
                            <ng-container *ngFor="let item of menuFilters">
                                <ng-container *ngIf="!navbar?.menu[0]?.link?.route">
                                    <div (click)="listSubMenu(item.submenu); setCurrentMenuName(item?.link?.labelValue); activeModuleMenu($event); setCurrentModuleFilter(item)" 
                                        (mouseenter)="showTempSubMenu(item.submenu)" 
                                        (mouseleave)="hideTempSubMenu()"
                                        [routerLink]="item?.submenu[0]?.link?.route"
                                        class="ln-bl-items ln-bl-module-menu" 
                                        [class.active]="retrievedArray?.link?.label == item?.link?.label"
                                        > <!-- resetActiveStateOfSubmenu(); -->
                                        <div class="bl-item">
                                            <div class="bl-item-icon">
                                                <ng-container *ngIf="item?.icon">
                                                    <scrm-image class="ln-icon-size" image="{{item?.icon}}"></scrm-image>
                                                    <!-- <img alt="" src="dist/themes/suite8/images/tabimages/{{item.icon}}.svg" class="ln-icon-size-img"> -->
                                                </ng-container>
                                                <ng-container *ngIf="!item?.icon">
                                                    <scrm-image class="ln-icon-size" image="folder"></scrm-image>
                                                </ng-container>
                                            </div>
                                            <div class="bl-item-text"> <!-- *ngIf="ln_open" -->
                                                <div class="bl-item-text-core" [title]="item.link.label">{{item.link.labelValue}}</div>
                                            </div>
                                        </div>
                                    </div>
                                </ng-container>
                            </ng-container>
                    </ng-container>

                    <!-- All Modules -->
                    <!-- <ng-container *ngFor="let item of navbar.all.modules; let i = index">
                        <div *ngIf="item.link.label !== 'Home' && item.link.label !== navbar?.current?.link?.label" (click)="listSubMenu(item.submenu)" class="ln-bl-items">
                            <a [routerLink]="item.link.route" class="bl-item">
                                <div class="bl-item-icon">
                                     <scrm-image class="ln-icon-size" image="{{item.icon}}"></scrm-image>
                                </div>
                                <div *ngIf="ln_open" class="bl-item-text">
                                    <div class="bl-item-text-core" [title]="item.link.label">{{item.link.label}}</div>
                                </div>
                            </a>
                        </div>
                    </ng-container> -->
                    <!-- End All Modules -->

                    <!-- All Modules Button-->
                    <!-- <div (click)="listSubMenu(['2all2']); activeAllMenu(); resetActiveStateOfSubmenu()" class="ln-bl-items ln-bl-module-menu" [class.active]="activeAll === 1">
                        <div class="bl-item">
                            <div class="bl-item-icon">
                                <scrm-image image="ln-Dots"></scrm-image>
                            </div>
                            <div *ngIf="ln_open" class="bl-item-text">All</div>
                        </div>
                    </div> -->

                </div>

                <!-- Log out Button -->
                <!-- <div class="ln-bl-bottom">
                    <div class="ln-blb-logout">
                        <div class="blb-logout-image">
                            <svg-icon src="../core/app/shell/src/themes/suite8/images/log-out-ln.svg"></svg-icon>
                        </div>
                        <div class="blb-logout-text">Log out</div>
                    </div>
                </div> -->
            </div>

            <!-- Submenu List -->
            <ng-container *ngIf="ln_open">
                <div class="ln-body-right">

                    <!-- home -->
                    <ng-container *ngIf= "submenu_items[0] == '2home2'">
                        <div class="ln-br-items">
                            <a class="br-item">
                                Home
                            </a>
                        </div>
                    </ng-container>

                    <!-- Current Module Submenu -->
                    <ng-container *ngIf= "submenu_items[0] == '2nothing2'">
                        <div *ngFor="let item of navbar?.current?.submenu; let i = index" class="ln-br-items">
                            <a [routerLink]="item.link.route" class="br-item">
                                {{item.link.label}}
                            </a>
                        </div>
                    </ng-container>

                    <!-- Module Menu Filter Submenu -->
                    <ng-container *ngIf= "submenu_items[0] != '2home2' && submenu_items[0] != '2nothing2' && submenu_items[0] != '2all2' && submenu_items[0] != '2refresh2'">
                        <div *ngFor="let item of submenu_items; let i = index" class="ln-br-items ln-bl-module-menu-submenu" [class.active]="item?.link?.label == navbar?.current?.link?.label"> <!-- [class.active]="activeIndexSubmenu === i" -->
                            <a [routerLink]="item.link.route" (click)="saveToLocalStorage()" class="br-item" > <!-- (click)="activeModuleMenuSubmenu($event)" --> <!-- [class.br-item-active-color-black]="activeIndexSubmenu === i" --> <!-- (click)="listSubMenu(['2nothing2'])" -->
                                {{item.link.label}}
                            </a>
                        </div>
                    </ng-container>

                    <!-- All Modules button submenu  -->
                    <!-- <ng-container *ngIf= "submenu_items[0] == '2all2'">
                        <div *ngFor="let item of navbar.all.modules; let i = index" class="ln-br-items ln-bl-module-menu-submenu" [class.active]="activeIndexSubmenu === i">
                            <a [routerLink]="item.link.route" (click)="activeModuleMenuSubmenu($event)" class="br-item"> (click)="listSubMenu(['2nothing2'])" -->
                                <!-- {{item.link.label}}
                            </a>
                        </div>
                    </ng-container> -->

                    <!-- On page Refresh, modules submenu -->
                    <ng-container *ngIf= "submenu_items[0] == '2refresh2'">
                        <ng-container *ngIf= "!navbar?.current">
                            <div class="ln-br-items">
                                <a class="br-item">
                                    Home
                                </a>
                            </div>
                        </ng-container>
                        <ng-container *ngIf= "navbar?.current">
                            <!-- On refresh retrievedArray local storage submenu - Module Menu Filter Submenu on Refresh-->
                            <ng-container *ngIf= "retrievedArray && !navbar?.menu[0]?.link?.route">
                                <div *ngFor="let item of retrievedArray?.submenu; let i = index" class="ln-br-items br-item-active-state" [class.active]="item?.link?.label == navbar?.current?.link?.label">
                                    <a [routerLink]="item.link.route" class="br-item">
                                        {{item.link.label}}
                                    </a>
                                </div>
                            </ng-container>

                            <!-- On refresh navbar current submenu -->
                            <ng-container *ngIf="navbar?.menu[0]?.link?.route">
                                <div *ngFor="let item of navbar?.current?.submenu; let i = index" class="ln-br-items">
                                    <a [routerLink]="item.link.route" class="br-item">
                                        {{item.link.label}}
                                    </a>
                                </div>
                            </ng-container>
                        </ng-container>
                    </ng-container>
            
                </div>
            </ng-container>

        </div>
