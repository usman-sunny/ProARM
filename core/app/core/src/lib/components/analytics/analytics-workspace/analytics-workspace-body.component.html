<!-- Main Workspace Body -->
<div class="analytics-workspace-content">

    <div class="nlt-workspace-header">

        <div class="nlt-workspace-header-top">
            <ng-container *ngIf="(collectionData$ | async) as collection">
                <div class="nlt-ws-header-title">{{collection.collectionName}}</div>
            </ng-container>
        </div>

        <div class="nlt-workspace-header-bottom">

            <!-- Search Bar Section and favourite button -->
            <div class="nlt-workspace-search-section">

                <!-- Search Bar -->
                <div class="ntl-ws-search-container">
                    <input type="text" class="ntl-ws-search-input" placeholder="Search"> <!--[(ngModel)]="searchQuery" -->
                    <button class="ntl-ws-search-button">
                        <scrm-image image="search_t"></scrm-image>
                    </button>
                </div>

                <!-- Favourites Button -->
                <div class="ntl-ws-favourites-btn">
                    <scrm-image image="cstm_fvrt_star"></scrm-image>
                </div>
            </div>

        </div>
    </div>

    <div class="nlt-ws-body-1">
        <!-- Card 1 -->
        <ng-container *ngIf="(collectionData$ | async) as collection">
            <div *ngFor="let card of collection.collectionData" (click)="openCard(card.id)" class="nlt-ws-card" >
                <div class="nlt-ws-card-header">
                    <div class="nlt-ws-header-left">
                        <div class="nlt-ws-header-title">{{card.name}}</div>
                        <div class="nlt-ws-header-time">Last Modified yesterday</div>
                    </div>
                    <div class="nlt-ws-header-right">
                        <div class="nlt-ws-header-favourite">
                            <scrm-image image="cstm_fvrt_star"></scrm-image>
                        </div>

                        <!-- edit/delete Dropdown -->
                        <div class="ntl-report-dropdown">
                            <div class="ntl-report-dropdown-btn">
                                <scrm-image image="three_dots"></scrm-image>
                            </div>

                            <div class="ntl-report-dropdown-content">
                                <div (click)="editReport($event, card.id)" class="ntl-report-dropdown-item">Edit</div>
                                <div (click)="openDeleteModal($event, card.id)" class="ntl-report-dropdown-item">Delete</div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="nlt-ws-card-body-image">
                    <div class="nlt-ws-cb-image-container">
                        <scrm-image image="cstm-nlt-ph1"></scrm-image>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>

</div>


<scrm-analytics-delete-modal *ngIf="isDeleteModalVisible" 
                             (closeModal)="closeDeleteModal()"
                             [deleteId]="reportId"
                             [deleteType]="'report'">
</scrm-analytics-delete-modal>
