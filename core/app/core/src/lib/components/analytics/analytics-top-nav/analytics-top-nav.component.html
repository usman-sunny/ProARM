<div class="analytics-top-nav-main">
    
    <div class="analytics-top-nav-items">

        <!-- Logo -->
        <div class="ntl-top-nav-logo" (click)="navigateToAnalyticsHome()">
            <scrm-image image="cstm_analytics"></scrm-image>
        </div>

        <!-- Home -->
        <div class="ntl-top-nav-home" (click)="navigateToAnalyticsHome()">Home</div>

        <!-- Workspaces Dropdown -->
        <div class="ntl-workspaces-dropdown">
            <div class="ntl-workspaces-dropdown-btn">
                <div class="ntl-workspaces-text">{{activeCollection?.name}}</div>
                <scrm-image image="cstm-nlt-arrow"></scrm-image>
            </div>
            <ng-container *ngIf="collections$ | async as collectionsData">
                <div class="ntl-workspaces-dropdown-content">
                    <div *ngFor="let collection of collectionsData.collections"
                         class="ntl-workspaces-dropdown-item"
                         [routerLink]="['/pd_collections', collection.id]"
                    >
                        {{collection.name}}
                    </div>
                </div>
            </ng-container>
        </div>
        
    </div>
</div>
