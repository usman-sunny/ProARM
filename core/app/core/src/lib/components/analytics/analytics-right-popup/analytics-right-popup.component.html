<div class="nlt-right-popup">
	<div class="nlt-right-popup-inside">

		<div class="nlt-right-popup-header">

			<ng-container *ngIf="popupType === 'reports'">
				<div *ngFor="let item of listItems" 
					routerLink="/pd_collections/{{collectionId}}/view/{{item.id}}" 
					class="nlt-dashboard-list-item"
				>
					<scrm-image image="cstm-nlt-reports"></scrm-image>
					<div class="nlt-dashboard-list-text">{{item.name}}</div>
				</div>
			</ng-container>

			<ng-container *ngIf="popupType === 'dashboards'">
				<div *ngFor="let item of listItems" 
					routerLink="/pd_collections/{{collectionId}}/viewdashboard/{{item.id}}" 
					class="nlt-dashboard-list-item"
				>
					<scrm-image image="cstm-nlt-dashboards"></scrm-image>
					<div class="nlt-dashboard-list-text">{{item.name}}</div>
				</div>
			</ng-container>

		</div>

		<div class="nlt-popup-btn" (click)="toggleMiniPopup()">
			
			<div class="nlt-popup-btn-icon">
				<scrm-image image="cstm-nlt-plus"></scrm-image>
			</div>

			<div class="nlt-popup-btn-text">
				Create New {{ popupType }}
			</div>
				
		</div>

		<!-- Mini Popup Menu -->
		<div *ngIf="popupType === 'reports' && isMiniPopupVisible" class="nlt-mini-popup-menu">
			<div class="nlt-mini-popup-title">Create New Reports</div>

			<div class="nlt-mini-popup-items">

				<div (click)="openReportModal('chart')" class="nlt-mini-popup-item">

					</div>
					<div class="nlt-mini-popup-item-text">
						<div class="nlt-mini-popup-text-title">Chart View</div>
						<div class="nlt-mini-popup-text-body">
							Chart View allows you to create 
							a graphical view using different 
							types of charts.
						</div>
					</div>
				</div>
