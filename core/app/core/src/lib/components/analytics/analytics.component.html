<div class="analytics-component">

    <!-- Analytics Top Navbar -->
    <div class="analytics-header">
        <div class="header-content">
            <div class="header-left">

                <!-- Back/Home Button -->
                <div class="back-button" (click)="navigateToHome()">
                    <scrm-image image="cstm_back_to_crm"></scrm-image>
                </div>

                <div class="analytics-icon">
                    <scrm-image image="cstm_analytics"></scrm-image>
                </div>

                <h1 class="analytics-title">Analytics</h1>
            </div>
        </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs-navigation">
        <ul class="navigation-tabs">
            <li class="navigation-item" [class.active]="activeTab === 'collections'">
                <a class="navigation-link" (click)="setActiveTab('collections')">Collections</a>
            </li>
            <li class="navigation-item" [class.active]="activeTab === 'dashboards'">
                <a class="navigation-link" (click)="setActiveTab('dashboards')">Dashboards</a>
            </li>
            <li class="navigation-item" [class.active]="activeTab === 'recent'">
                <a class="navigation-link" (click)="setActiveTab('recent')">Recent Items</a>
            </li>
        </ul>

        <div (click)="openCollectionPopup()" class="create-collection-btn">
            Create Collection
        </div>
    </div>

    <!-- Analytics Content Body -->
    <div class="analytics-content-body">

        <!-- Search Bar Section and favourite button-->
        <div class="search-section">

            <!-- Favourites Button -->
            <div class="nltcs-favourites-btn">
                <scrm-image image="cstm_fvrt_star"></scrm-image>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search" [(ngModel)]="searchQuery">
                <button class="search-button">
                    <scrm-image image="search_t"></scrm-image>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="nltcs-hp-body">

            <!-- Card for each collection -->
            <ng-container *ngIf="(collections$ | async) as collectionsData">
                <ng-container *ngFor="let collection of collectionsData.collections">
                    <div class="nltcs-card" (click)="navigateToCollection(collection.id)">
                        <div class="nltcs-card-header">
                            <div class="nltcs-header-left">
                                <div class="nltcs-header-title">{{collection.name}}</div>
                                <div class="nltcs-header-time">Created: {{collection.date_entered}}</div>
                            </div>
                            <div class="nltcs-header-right">
                                <div class="nltcs-header-favourite">
                                    <scrm-image image="cstm_fvrt_star"></scrm-image>
                                </div>
                                
                                <!-- edit/delete Dropdown -->
                                <div class="ntl-collection-dropdown">
                                    <div class="ntl-collection-dropdown-btn">
                                        <scrm-image image="three_dots"></scrm-image>
                                    </div>

                                    <div class="ntl-collection-dropdown-content">
                                        <div (click)="openEditCollectionModal($event, collection.id, collection.name)" class="ntl-collection-dropdown-item">Edit</div>
                                        <div (click)="openDeleteModal($event, collection.id)" class="ntl-collection-dropdown-item">Delete</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="nltcs-card-body-image">
                            <div class="nltcs-cb-image-container">
                                <scrm-image image="cstm_placehoolder"></scrm-image>
                            </div>
                        </div>

                        <div class="nltcs-card-footer">
                            <div class="nltcs-footer-text">Owned</div>
                        </div>
                    </div>
                </ng-container>
            </ng-container>
        </div>

    </div>
</div>


<!-- Create Collection Popup -->
<div *ngIf="isCollectionPopupVisible" class="create-collection-freeze-layer">
    <div class="create-collection-popup-main">
        <div class="create-collection-popup-header">
            <div class="create-collection-title">Create New Collection</div>
            <div (click)="closeCollectionPopup()" class="create-collection-close-btn">
                <scrm-image image="cross"></scrm-image>
            </div>
        </div>

        <div class="create-collection-popup-body">
            <div class="create-collection-popup-body-title">Enter Collection Name</div>
            <input type="text" [(ngModel)]="collectionName" class="create-collection-popup-body-input">
            <div *ngIf="collectionNameError" class="create-collection-popup-body-error">Collection name is required</div>
        </div>

        <div class="create-collection-popup-footer">
            <div (click)="closeCollectionPopup()" class="create-collection-cancel-btn">Cancel</div>
            <div (click)="createCollection()" class="create-collection-ok-btn">Create</div>
        </div>
    </div>
</div>

<scrm-analytics-delete-modal *ngIf="isDeleteModalVisible" 
                             (closeModal)="closeDeleteModal()"
                             [deleteId]="collectionId"
                             [deleteType]="'collection'">
</scrm-analytics-delete-modal>


<!-- edit Collection name modal -->
<div *ngIf="isEditCollectionModalVisible" class="nlt-edit-collection-freeze-layer">
    <div class="nlt-ec-modal-main">

        <div class="nlt-ec-modal-header">
            <div class="nlt-ec-modal-title">Edit Collection Name</div>
            <div (click)="closeEditCollectionModal()" class="nlt-ec-modal-close-btn">
                <scrm-image image="cross"></scrm-image>
            </div>
        </div>

        <div class="nlt-ec-modal-body">
            <div class="nlt-ec-modal-inner-text">Collection Name:</div>
            <input type="text" class="nlt-ec-modal-input" [(ngModel)]="editCollectionName">
        </div>

        <div class="nlt-ec-modal-footer">
            <div (click)="closeEditCollectionModal()" class="nlt-ec-modal-cancel-btn">Cancel</div>
            <div (click)="editCollection()" class="nlt-ec-modal-ok-btn">OK</div>
        </div>

    </div>
</div>
