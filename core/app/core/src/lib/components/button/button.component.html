<!-- Add Email Button -->
<ng-container *ngIf="config?.icon == 'plus'; else elseIfBlock">
    <button type="button"
            class="cstm-add-email-btn"
            (click)="runClick($event)"
            [disabled]="config?.disabled || ''"
            [title]="(language.getFieldLabel(config.titleKey) || config?.title) || ''">
        <div>Add Email</div>
    </button>
</ng-container>

<!-- Delete Email Button -->
<ng-template #elseIfBlock>
    <ng-container *ngIf="config?.icon == 'minimise'; else elseIfBlock2">
        <button type="button"
                class="cstm-delete-email-btn"
                (click)="runClick($event)"
                [disabled]="config?.disabled || ''"
                [title]="(language.getFieldLabel(config.titleKey) || config?.title) || ''">
            <scrm-image image="cstm_delete"></scrm-image>
        </button>
    </ng-container>
</ng-template>

<!-- Edir Button Block -->
<ng-template #elseIfBlock2>
    <ng-container *ngIf="config?.label == 'Edit'; else elseIfBlock3">
        <button type="button"
                class="cstm-edit-btn"
                (click)="runClick($event)"
                [disabled]="config?.disabled || ''"
                [title]="(language.getFieldLabel(config.titleKey) || config?.title) || ''">
            <scrm-label *ngIf="config.labelKey" [labelKey]="config.labelKey" [module]="config.labelModule ?? ''"></scrm-label>
            <scrm-image image="cstm_edit"></scrm-image>
        </button>
    </ng-container>
</ng-template>

<!-- Empty Block - Insights Button -->
<ng-template #elseIfBlock3>
    <ng-container *ngIf="config?.label == 'Insights' || config?.label == 'Save' || config?.label == 'Cancel' || config?.label == 'Save And Continue'; else elseBlock">
        <!-- Empty -->
    </ng-container>
</ng-template>

<!-- Default Code Block -->
<ng-template #elseBlock>
    <button type="button"
            [ngClass]="config.klass"
            (click)="runClick($event)"
            [disabled]="config?.disabled || ''"
            [title]="(language.getFieldLabel(config.titleKey) || config?.title) || ''">
        <scrm-image *ngIf="config.icon"
                    [image]="config.icon"
                    [klass]="config.iconKlass || ''"
                    [title]="language.getFieldLabel(config.titleKey || '')"></scrm-image>
        <ng-container *ngIf="!config.labelKey">{{ config.label || '' }}</ng-container>
        <scrm-label *ngIf="config.labelKey" [labelKey]="config.labelKey" [module]="config.labelModule ?? ''"></scrm-label>
        <ng-content></ng-content>
    </button>
</ng-template>
