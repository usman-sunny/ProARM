<!-- Start Record View Section -->
<div class="record-view" *ngIf="(vm$ | async) as vm">

    <div class="record-view-position-sticky">

        <div class="detail-head-container">
            <div class="list-head-main">

                <div class="lh-left-box">

                    <!-- Back Button -->
                    <a href="#{{navbar?.current?.link?.route}}" class="lh-back-btn">
                        <div class="lh-back-icon">
                            <scrm-image image="lvh-back"></scrm-image>
                        </div>
                    </a>

                    <!-- Insights Button -->
                    <div (click)="toggleInsights()" class="lh-insights-btn">
                        <div class="lh-insights-icon">
                            <scrm-image image="lvh-insights"></scrm-image>
                        </div>
                        <div class="lh-insights-text">Show Insights</div>
                    </div>

                </div>

                <div class="lh-right-box">

                    <!-- Action button and dropdown -->
                    <div class="lh-action-btn">
                        <div class="lh-import">
                            <div class="lh-import-title">Action</div>
                            <scrm-image class="ln-icon-size" image="lvh-darrow"></scrm-image>
                        </div>
                        <div class="lh-drop-content">
                            <div class="lh-drop-body">
                                <ng-container *ngFor="let item of actionButtons?.collapsed; let i = index">
                                    <div class="lh-bd-text" (click)="click(item.onClick)">
                                        <div>{{item.label}}</div>
                                    </div>
                                    <div class="lh-break-row"></div>
                                </ng-container>

                                <!-- <div class="lh-bd-text"><div>View Change Log</div></div>
                                <div class="lh-break-row"></div>
                                <div class="lh-bd-text"><div>Find Duplicates</div></div>
                                <div class="lh-break-row"></div>
                                <div class="lh-bd-text" (click)="click(actionButtons?.collapsed[1]?.onClick)"><div>Duplicate</div></div>
                                <div class="lh-break-row"></div>
                                <div class="lh-bd-text"><div>Delete</div></div> -->
                            </div>
                        </div>
                    </div>

                    <!-- Export button -->
                    <div class="rb-export-btn">
                        <div class="rb-export-icon">
                            <scrm-image image="c2-export"></scrm-image>
                        </div>
                        <div class="rb-export-text">Export</div>
                    </div>

                    <!-- Print button -->
                    <ng-container *ngFor="let item of actionButtons?.collapsed; let i = index">
                        <ng-container *ngIf="item.label === 'Print as PDF'">
                            <div class="rb-print-btn" (click)="click(item.onClick)">
                                <div class="rb-print-icon">
                                    <scrm-image image="c2-print"></scrm-image>
                                </div>
                                <div class="rb-print-text">Print</div>
                                <!-- <div class="rb-print-arrow">
                                    <scrm-image class="ln-icon-size" image="arrowd_t"></scrm-image>
                                </div> -->
                            </div>
                        </ng-container>
                    </ng-container>

                    <!-- Search Box -->
                    <div class="rb-search-box">
                        <scrm-image class="rb-search-icon" image="c2-search"></scrm-image>
                        <input class="rb-search-input" type="text" placeholder="Search">
                    </div>

                </div>
            </div>
        </div>

        <scrm-record-header></scrm-record-header>
    </div>
    <!-- <div class="record-view-hr-container">
        <hr class="record-view-hr">
    </div> -->

    <scrm-status-bar *ngIf="showStatusBar"></scrm-status-bar>
    <scrm-record-container [showRecordInsights]="showInsights"></scrm-record-container>
</div>
<!-- End Record View Section -->
