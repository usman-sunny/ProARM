<ng-container>
    <div class="list-head-container">
        <div class="list-head-main">

            <div class="lh-left-box">
                <div *ngIf="listStore?.widgets" 
                    (click)="click(insightsButton?.onClick)" 
                    class="lh-insights-btn"
                >
                    <div class="lh-insights-icon">
                        <scrm-image image="lvh-insights"></scrm-image>
                    </div>
                    <div class="lh-insights-text">Show Insights</div>
                </div>
            </div>

            <div class="lh-right-box">

                <!-- Import button and dropdown -->
                <ng-container *ngFor="let item of navbar?.current?.submenu">
                    <ng-container *ngIf="item.icon == 'download'">
                        <div class="lh-import-btn">
                            <div class="lh-import">
                                <scrm-image image="lvh-import"></scrm-image>
                                <div class="lh-import-title">Import</div>
                                <scrm-image class="ln-icon-size" image="lvh-darrow"></scrm-image>
                            </div>
                            <div class="lh-drop-content">
                                <div class="lh-drop-body">
                                    <a [routerLink]="item?.link?.route" [queryParams]="item?.link?.params" class="lh-bd-text"><div>Files</div></a>
                                    <div class="lh-break-row"></div>
                                    <a [routerLink]="'/ai_generate/synthetic_data'" 
                                       [queryParams]="{module_name: getCleanModuleName(), module_key: navbar?.current?.module, package_name: currentMenuName}" 
                                       class="lh-bd-text"
                                    >
                                        <div>Synthetic Data Generator</div>
                                    </a>
                                </div>  
                            </div>
                        </div>
                    </ng-container>
                </ng-container>

                <!-- Export button -->
                <div 
                    (click)="click(bulkActions?.items[1]?.onClick)"
                    class="rb-export-btn"
                    [class.disable-export]="count <= 0"  
                > <!-- [style.pointer-events]="count > 0 ? 'auto' : 'none'" -->
                    <div class="rb-export-icon">
                        <scrm-image image="c2-export"></scrm-image>
                    </div>
                    <div class="rb-export-text">Export</div>
                </div>

                <!-- Print button -->
                <ng-container *ngFor="let item of bulkActions?.items">
                    <ng-container *ngIf="item.labelKey == 'LBL_PRINT_AS_PDF'">
                        <div (click)="click(item?.onClick)" class="rb-print-btn" [class.disable-export]="count <= 0">
                            <div class="rb-print-icon">
                                <scrm-image image="c2-print"></scrm-image>
                            </div>
                            <div class="rb-print-text">Print</div>
                            <!-- <div class="rb-print-arrow">
                                <scrm-image class="ln-icon-size" image="arrowd_t"></scrm-image>
                            </div> -->
                        </div>
                    </ng-container>
                </ng-container>

                <!-- Filter button -->
                <div (click)="toggleFilters()" class="rb-filter-btn">
                    <div class="rb-filter-icon">
                        <scrm-image image="c2-filter"></scrm-image>
                    </div>
                </div>

                <!-- Search Box -->
                <div class="rb-search-box">
                    <scrm-image class="rb-search-icon" image="c2-search"></scrm-image>
                    <input class="rb-search-input" 
                           type="text" 
                           placeholder="Search"
                           [(ngModel)]="searchText"
                           (input)="onSearchInputChange($event)">
                </div>

            </div>  
        </div>
    </div>

</ng-container>
